plugins {
    id 'java'
    id 'maven-publish'
}

group = 'usr.paulolaup'
version = '0.0.2-alpha'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Docker
    testImplementation 'com.github.docker-java:docker-java:3.4.1'

    // HAPI FHIR
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-client:7.6.0'
    testImplementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:7.6.0'

    // Jackson
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'
}

test {
    useJUnitPlatform()
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/paulolaup/hapifhir-oauth-client"
            credentials {
                username = System.getenv("USERNAME")
                password = System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}