name: Run Tests after Push

on: [push]

jobs:
  run-test-after-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TEST
        run: echo "$GITHUB_WORKSPACE"

      - name: Setup prerequisites
        uses: ./.github/actions/setup/action.yml

      - name: Build project
        uses: ./.github/actions/build-project/action.yml

      - name: Run tests
        uses: ./.github/actions/run-tests/action.yml